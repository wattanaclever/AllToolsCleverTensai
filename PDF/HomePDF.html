    <style>

            background-size: 24px 24px, 48px 48px, 48px 48px;
        }

        /* High-tech custom scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #F3F4F6;
        }

        ::-webkit-scrollbar-thumb {
            background: #FF1E42;
            border-radius: 2px;
        }

        .tech-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.03);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tech-card:hover {
            border-color: rgba(255, 30, 66, 0.45);
            box-shadow: 0 12px 28px -6px rgba(255, 30, 66, 0.12);
            transform: translateY(-5px);
        }

        .tech-card:hover .preview-zoom {
            transform: scale(1.04);
        }

        .preview-zoom {
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .red-glow {
            box-shadow: 0 4px 16px rgba(255, 30, 66, 0.25);
        }

        /* Laser Scanline Effect (Active on Hover) */
        .scanline {
            opacity: 0;
            background: linear-gradient(to bottom,
                    rgba(255, 255, 255, 0),
                    rgba(255, 30, 66, 0.2),
                    rgba(255, 255, 255, 0));
            transition: opacity 0.25s ease;
        }

        .tech-card:hover .scanline {
            opacity: 1;
            animation: scan 2.8s linear infinite;
        }

        @keyframes scan {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(1000%);
            }
        }

                badge: "MODULE 05 // CONVERT",
                version: "v1.0",
                description: "แปลงไฟล์รูปภาพ (JPG, PNG, WebP) หรือไฟล์ข้อความและเอกสารให้เป็นไฟล์ PDF มาตรฐาน รวมหลายรูปภาพเป็นเล่มเดียวได้ทันที",
                href: "ConvertToPDF.html",
                icon: "fa-solid fa-file-import",
                previewType: "convert",
                tags: ["แปลงรูปภาพเป็น PDF", "รองรับ JPG / PNG / WebP", "จัดหน้าอัตโนมัติ"]
            },
            {
                id: "crop-pdf",
                title: "Crop & Rotate PDF",
                subtitle: "CROP MARGINS & ROTATE PAGES",
                badge: "MODULE 06 // CROP & ROTATE",
                version: "NEW",
                description: "ตัดขอบหน้าเอกสาร หมุนหน้ากระดาษ 90°/180° แบบเรียลไทม์ ปรับสัดส่วนมาตรฐาน และตัดขอบขาวอัตโนมัติ",
                href: "CropPDF.html",
                icon: "fa-solid fa-crop-simple",
                previewType: "crop",
                tags: ["ครอบตัดพื้นที่อิสระ", "หมุนหน้า 90° ซ้าย/ขวา", "ตัดขอบขาวอัตโนมัติ"]
            }
        ];

        /**
         * สร้างภาพพรีวิวกราฟิกแบบ Custom HTML/CSS ให้ตรงกับแต่ละเครื่องมือ PDF
         */
        function buildToolPreviewGraphic(tool) {
            let visualContent = '';

            if (tool.previewType === 'merge') {
                visualContent = `
                    <div class="preview-zoom relative z-10 w-64 bg-gray-900/95 border border-gray-800 rounded-xl p-3.5 shadow-2xl">
                        <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-gray-800">
                            <div class="flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-crimson-500"></span>
                                <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                            </div>
                            <span class="font-mono text-[9px] text-red-400">MERGE_PIPELINE</span>
                        </div>
                        <div class="flex items-center justify-between gap-2 px-1">
                            <!-- ไฟล์ย่อย 2 ไฟล์ -->
                            <div class="flex flex-col gap-1.5">
                                <div class="w-16 h-8 rounded bg-gray-800 border border-gray-700 flex items-center justify-center gap-1.5 px-1.5">
                                    <i class="fa-solid fa-file-pdf text-crimson-500 text-xs"></i>
                                    <span class="font-mono text-[8px] text-gray-300">DOC_01</span>
                                </div>
                                <div class="w-16 h-8 rounded bg-gray-800 border border-gray-700 flex items-center justify-center gap-1.5 px-1.5">
                                    <i class="fa-solid fa-file-pdf text-crimson-500 text-xs"></i>
                                    <span class="font-mono text-[8px] text-gray-300">DOC_02</span>
                                </div>
                            </div>

                            <!-- ลูกศรรวมไฟล์ -->
                            <div class="text-crimson-500 text-sm flex flex-col items-center">
                                <i class="fa-solid fa-angles-right"></i>
                                <span class="font-mono text-[8px] text-gray-400 mt-0.5">JOIN</span>
                            </div>

                            <!-- ไฟล์ผลลัพธ์รวม -->
                            <div class="w-20 h-16 rounded-lg bg-crimson-500/20 border border-crimson-500/50 flex flex-col items-center justify-center p-1.5 shadow-inner">
                                <i class="fa-solid fa-layer-group text-crimson-500 text-lg mb-1"></i>
                                <span class="font-mono text-[8px] text-white font-bold">MERGED.PDF</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tool.previewType === 'split') {
                visualContent = `
                    <div class="preview-zoom relative z-10 w-64 bg-gray-900/95 border border-gray-800 rounded-xl p-3.5 shadow-2xl">
                        <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-gray-800">
                            <span class="font-mono text-[9px] text-gray-400">PAGE_EXTRACTOR</span>
                            <span class="px-1.5 py-0.5 rounded bg-crimson-500/20 text-red-400 font-mono text-[8px] font-bold">CUT &amp; EXTRACT</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 items-center">
                            <div class="h-14 rounded-lg bg-crimson-500/20 border border-crimson-500 flex flex-col items-center justify-center relative">
                                <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-crimson-500"></span>
                                <span class="font-mono text-[10px] text-white font-bold">P.01</span>
                                <span class="font-mono text-[7px] text-red-300">SELECTED</span>
                            </div>
                            <div class="h-14 rounded-lg bg-gray-800/60 border border-dashed border-gray-700 flex flex-col items-center justify-center opacity-50">
                                <i class="fa-solid fa-scissors text-gray-400 text-xs mb-0.5"></i>
                                <span class="font-mono text-[9px] text-gray-400">P.02</span>
                            </div>
                            <div class="h-14 rounded-lg bg-crimson-500/20 border border-crimson-500 flex flex-col items-center justify-center relative">
                                <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-crimson-500"></span>
                                <span class="font-mono text-[10px] text-white font-bold">P.03</span>
                                <span class="font-mono text-[7px] text-red-300">SELECTED</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tool.previewType === 'edit') {
                visualContent = `
                    <div class="preview-zoom relative z-10 w-64 bg-gray-900/95 border border-gray-800 rounded-xl p-3.5 shadow-2xl">
                        <div class="flex items-center justify-between pb-2 mb-2 border-b border-gray-800">
                            <div class="flex items-center gap-2 text-[10px] text-gray-300">
                                <i class="fa-solid fa-font text-crimson-500"></i>
                                <i class="fa-solid fa-pen text-amber-400"></i>
                                <i class="fa-solid fa-highlighter text-emerald-400"></i>
                            </div>
                            <span class="font-mono text-[9px] text-red-400">CANVAS_EDITOR</span>
                        </div>
                        <div class="bg-gray-800/80 border border-gray-700 rounded-lg p-2.5 space-y-1.5 text-left relative">
                            <div class="h-2 w-28 bg-gray-600 rounded"></div>
                            <div class="flex items-center gap-1.5">
                                <div class="h-2 w-16 bg-crimson-500/70 rounded"></div>
                                <span class="px-1.5 py-0.5 rounded bg-crimson-500 text-white font-mono text-[8px] font-bold">TEXT + SIGN</span>
                            </div>
                            <div class="h-2 w-36 bg-gray-700 rounded"></div>
                        </div>
                    </div>
                `;
            } else if (tool.previewType === 'compress') {
                visualContent = `
                    <div class="preview-zoom relative z-10 w-64 bg-gray-900/95 border border-gray-800 rounded-xl p-3.5 shadow-2xl">
                        <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-gray-800">
                            <span class="font-mono text-[9px] text-gray-400">SIZE_OPTIMIZER</span>
                            <span class="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-mono text-[8px] font-bold">-77% SAVED</span>
                        </div>
                        <div class="flex items-center justify-between gap-2 px-1">
                            <div class="w-20 h-14 rounded-lg bg-gray-800 border border-gray-700 flex flex-col items-center justify-center p-1">
                                <span class="font-mono text-[8px] text-gray-400">BEFORE</span>
                                <span class="font-mono text-[11px] text-gray-200 font-bold line-through mt-0.5">12.4 MB</span>
                            </div>

                            <div class="text-crimson-500 text-sm flex flex-col items-center">
                                <i class="fa-solid fa-angles-right"></i>
                                <span class="font-mono text-[7px] text-gray-400 mt-0.5">ZIP</span>
                            </div>

                            <div class="w-20 h-14 rounded-lg bg-crimson-500/20 border border-crimson-500/60 flex flex-col items-center justify-center p-1 shadow-inner">
                                <span class="font-mono text-[8px] text-red-300">AFTER</span>
                                <span class="font-mono text-[11px] text-white font-extrabold mt-0.5">2.8 MB</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tool.previewType === 'convert') {
                visualContent = `
                    <div class="preview-zoom relative z-10 w-64 bg-gray-900/95 border border-gray-800 rounded-xl p-3.5 shadow-2xl">
                        <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-gray-800">
                            <span class="font-mono text-[9px] text-gray-400">FORMAT_CONVERTER</span>
                            <span class="px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 font-mono text-[8px] font-bold">IMG / TXT</span>
                        </div>
                        <div class="flex items-center justify-between gap-2 px-1">
                            <!-- ไฟล์ต้นทาง JPG / PNG -->
                            <div class="flex flex-col gap-1.5">
                                <div class="w-16 h-7 rounded bg-gray-800 border border-gray-700 flex items-center justify-center gap-1.5 px-1.5">
                                    <i class="fa-regular fa-image text-sky-400 text-[11px]"></i>
                                    <span class="font-mono text-[8px] text-gray-300">IMG.JPG</span>
                                </div>
                                <div class="w-16 h-7 rounded bg-gray-800 border border-gray-700 flex items-center justify-center gap-1.5 px-1.5">
                                    <i class="fa-regular fa-file-lines text-amber-400 text-[11px]"></i>
                                    <span class="font-mono text-[8px] text-gray-300">DOC.PNG</span>
                                </div>
                            </div>

                            <!-- ลูกศรแปลงไฟล์ -->
                            <div class="text-crimson-500 text-sm flex flex-col items-center">
                                <i class="fa-solid fa-angles-right"></i>
                                <span class="font-mono text-[7px] text-gray-400 mt-0.5">CONVERT</span>
                            </div>

                            <!-- ไฟล์ผลลัพธ์ PDF -->
                            <div class="w-20 h-16 rounded-lg bg-crimson-500/20 border border-crimson-500/60 flex flex-col items-center justify-center p-1.5 shadow-inner">
                                <i class="fa-solid fa-file-pdf text-crimson-500 text-lg mb-1"></i>
                                <span class="font-mono text-[8px] text-white font-bold">OUTPUT.PDF</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tool.previewType === 'crop') {
                visualContent = `
                    <div class="preview-zoom relative z-10 w-64 bg-gray-900/95 border border-gray-800 rounded-xl p-3.5 shadow-2xl">
                        <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-gray-800">
                            <span class="font-mono text-[9px] text-gray-400">CROP_&amp;_ROTATE</span>
                            <span class="px-1.5 py-0.5 rounded bg-crimson-500/20 text-red-400 font-mono text-[8px] font-bold">AUTO-TRIM</span>
                        </div>
                        <div class="flex items-center justify-center relative py-0.5">
                            <!-- แผ่นกระดาษสีขาวขนาดย่อ -->
                            <div class="w-24 h-16 rounded bg-white border border-gray-300 shadow-md relative flex flex-col justify-center gap-1.5 px-3">
                                <div class="h-1.5 w-12 bg-gray-300 rounded"></div>
                                <div class="h-1.5 w-16 bg-gray-400 rounded"></div>
                                <div class="h-1.5 w-10 bg-gray-300 rounded"></div>

                                <!-- กรอบครอบตัดสีแดงเส้นประพร้อมจุดจับ 4 มุม -->
                                <div class="absolute inset-x-1.5 inset-y-1 border-2 border-dashed border-crimson-500 bg-crimson-500/10 rounded-[2px]">
                                    <span class="absolute -top-1 -left-1 w-2 h-2 bg-white border border-crimson-500 rounded-[1px]"></span>
                                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-white border border-crimson-500 rounded-[1px]"></span>
                                    <span class="absolute -bottom-1 -left-1 w-2 h-2 bg-white border border-crimson-500 rounded-[1px]"></span>
                                    <span class="absolute -bottom-1 -right-1 w-2 h-2 bg-white border border-crimson-500 rounded-[1px]"></span>
                                </div>
                            </div>

                            <!-- ป้ายไอคอนหมุนหน้า 90 องศา -->
                            <div class="absolute right-3 -bottom-0.5 px-1.5 py-1 rounded-lg bg-gray-800 border border-gray-700 text-sky-400 font-mono text-[8px] font-bold flex items-center gap-1 shadow-lg">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>90°</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                visualContent = `
                    <div class="preview-zoom relative z-10 text-center">
                        <div class="w-16 h-16 rounded-2xl bg-gray-900 border border-crimson-500/40 flex items-center justify-center mx-auto mb-2 text-crimson-500 text-2xl shadow-lg">
                            <i class="${tool.icon || 'fa-solid fa-file-pdf'}"></i>
                        </div>
                        <span class="font-mono text-xs text-gray-300">${tool.title}</span>
                    </div>
                `;
            }

            return `
                <div class="relative h-48 w-full overflow-hidden bg-gray-950 flex items-center justify-center p-4 border-b border-tech-border">
                    <!-- Tech Grid Pattern -->
                    <div class="absolute inset-0 opacity-20"
                        style="background-image: radial-gradient(#FF1E42 1px, transparent 1px); background-size: 16px 16px;"></div>
                    <!-- Hover Scanline -->
                    <div class="scanline absolute inset-0 pointer-events-none"></div>

                    ${visualContent}

                    <div class="absolute top-3 left-3 px-2.5 py-1 rounded-md bg-gray-900/90 border border-gray-800 text-gray-200 font-mono text-[10px] tracking-wider uppercase">
                        ${tool.badge}
                    </div>
                    <div class="absolute top-3 right-3 px-2 py-0.5 rounded bg-crimson-500 text-white font-mono text-[10px] font-bold">
                        ${tool.version}
                    </div>
                </div>
            `;
        }

        /**
         * เรนเดอร์การ์ดเครื่องมือ PDF ทั้งหมดลงใน Grid 3 คอลัมน์
         */
        function renderPdfToolsGrid() {
            const grid = document.getElementById('pdfToolsGrid');
            const counter = document.getElementById('toolCounter');

            if (counter) counter.textContent = PDF_TOOLS.length;

            grid.innerHTML = PDF_TOOLS.map(tool => {
                const tagsHtml = (tool.tags || []).map(tag => `
                    <span class="px-2.5 py-1 rounded-md bg-tech-panel border border-tech-border font-mono text-[11px] text-tech-dark">
                        ${tag}
                    </span>
                `).join('');

                return `
                    <article class="tech-card rounded-2xl overflow-hidden flex flex-col justify-between group">
                        <div>
                            <!-- ภาพพรีวิวด้านบนของการ์ด -->
                            ${buildToolPreviewGraphic(tool)}

                            <!-- เนื้อหาของการ์ด -->
                            <div class="p-6">
                                <div class="flex items-center gap-3 mb-3">
                                    <div class="w-10 h-10 rounded-xl bg-crimson-50 border border-crimson-100 text-crimson-500 group-hover:bg-crimson-500 group-hover:text-white flex items-center justify-center text-base shrink-0 transition-colors">
                                        <i class="${tool.icon}"></i>
                                    </div>
                                    <div>
                                        <h2 class="text-xl font-extrabold text-tech-dark group-hover:text-crimson-500 transition-colors leading-tight">
                                            ${tool.title}
                                        </h2>
                                        <div class="font-mono text-[10px] text-tech-muted tracking-wider mt-0.5">
                                            ${tool.subtitle}
                                        </div>
                                    </div>
                                </div>

                                <p class="text-sm text-tech-muted leading-relaxed mb-4">
                                    ${tool.description}
                                </p>

                                <div class="flex flex-wrap gap-1.5">
                                    ${tagsHtml}
                                </div>
                            </div>
                        </div>

                        <!-- ปุ่มเข้าใช้งานเครื่องมือ -->
                        <div class="px-6 pb-6 pt-3.5 border-t border-tech-border/70 flex items-center justify-between gap-3">
                            <span class="font-mono text-[11px] text-tech-muted truncate">
                                <i class="fa-solid fa-file-code text-crimson-500 mr-1"></i>${tool.href}
                            </span>
                            <a href="${tool.href}"
                                class="px-5 py-2.5 rounded-xl bg-gray-950 hover:bg-crimson-500 text-white font-bold text-xs tracking-wider uppercase flex items-center gap-2 transition-all shadow-sm shrink-0">
                                <span>เปิดใช้งาน</span>
                                <i class="fa-solid fa-arrow-right text-xs"></i>
                            </a>
                        </div>
                    </article>
                `;
            }).join('');
        }

        window.onload = function () {
            renderPdfToolsGrid();
        };
    </script>
</body>

</html>
